
name: Build My Gallery APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q My_Gallery_Android_Project.zip -d project

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Gallery-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
